name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Une vraie base Postgres est nécessaire ici : ApiApplicationTests (@SpringBootTest)
    # charge tout le contexte Spring, donc une vraie connexion DB au démarrage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gudnuz
          POSTGRES_USER: gudnuz_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: gudnuz
      DB_USERNAME: gudnuz_user
      DB_PASSWORD: ci_test_password
      # Clé JWT jetable, utilisée uniquement le temps du run CI — jamais la vraie clé de prod.
      JWT_SECRET_KEY: yXwqBjsUb7qbAGst+MQiqEAOqW94a5BP3xWevIYxu2Y=

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build + tests
        run: ./mvnw clean verify

      - name: Upload du rapport de couverture (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      # Généré par le même `mvn clean verify` ci-dessus (le plugin est bindé sur la phase verify) —
      # rapide, pas d'appel réseau, donc pas besoin d'un job séparé contrairement à Dependency-Check.
      - name: Upload du rapport SpotBugs / Find Security Bugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 30

  # Le scan de dépendances (OWASP Dependency-Check) n'est plus ici : il a son propre workflow,
  # .github/workflows/security-scan.yml, avec des déclencheurs adaptés à ce qu'il vérifie
  # (voir les commentaires en tête de ce fichier).

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extraction des métadonnées (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Déploiement sur le VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/gudnuz-api
            git pull
            docker compose pull
            docker compose up -d
            docker compose restart nginx
            docker image prune -f