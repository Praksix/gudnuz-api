name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Une vraie base Postgres est nécessaire ici : ApiApplicationTests (@SpringBootTest)
    # charge tout le contexte Spring, donc une vraie connexion DB au démarrage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gudnuz
          POSTGRES_USER: gudnuz_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: gudnuz
      DB_USERNAME: gudnuz_user
      DB_PASSWORD: ci_test_password
      # Clé JWT jetable, utilisée uniquement le temps du run CI — jamais la vraie clé de prod.
      JWT_SECRET_KEY: yXwqBjsUb7qbAGst+MQiqEAOqW94a5BP3xWevIYxu2Y=

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Configuration Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build + tests
        run: ./mvnw clean verify

      - name: Upload du rapport de couverture (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      # Généré par le même `mvn clean verify` ci-dessus (le plugin est bindé sur la phase verify) —
      # rapide, pas d'appel réseau, donc pas besoin d'un job séparé contrairement à Dependency-Check.
      - name: Upload du rapport SpotBugs / Find Security Bugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 30

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Configuration Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          # Pas de `cache: maven` ici : le step de cache dédié ci-dessous couvre ~/.m2/repository
          # (dépendances Maven + base CVE NVD), avec une stratégie de clé adaptée à cette dernière.

      # La base CVE du NIST (~/.m2/repository, comme les dépendances Maven classiques) est mise en
      # cache entre les runs, sinon le téléchargement complet (~385k entrées la première fois) se
      # répéterait à chaque push. Clé datée à l'heure près : contrairement au cache Maven classique
      # (clé = hash du pom.xml), la base CVE doit se rafraîchir même quand pom.xml ne change pas.
      - name: Date pour la clé de cache
        id: get-date
        run: echo "datetime=$(date -u '+%Y%m%d%H')" >> "$GITHUB_OUTPUT"

      - name: Cache Maven + base CVE (Dependency-Check)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ steps.get-date.outputs.datetime }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ steps.get-date.outputs.datetime }}
            ${{ runner.os }}-maven-

      # Job séparé de build-and-test : la synchro de la base CVE du NIST peut être lente/rate-limitée
      # sans clé API (voir NVD_API_KEY plus bas), pas de raison de ralentir le retour tests/build pour ça.
      # continue-on-error : ce scan reste informatif (rapport en artefact) — le NVD a montré ce soir
      # qu'il pouvait être temporairement indisponible (503) indépendamment de tout ce qu'on contrôle,
      # et faire échouer toute la CI pour ça n'est pas souhaitable. Dependabot fait la veille de
      # sécurité continue sur les dépendances, en tâche de fond, sans ce problème de disponibilité.
      - name: Analyse des dépendances (OWASP Dependency-Check)
        continue-on-error: true
        run: ./mvnw org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Upload du rapport Dependency-Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30


  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extraction des métadonnées (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Déploiement sur le VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/gudnuz-api
            git pull
            docker compose pull
            docker compose up -d
            docker compose restart nginx
            docker image prune -f